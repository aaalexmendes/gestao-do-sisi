# =====================================================================
#  Painel Unificado SISI · trecho para o Nginx (dentro do bloco server {})
#  Supõe o painel publicado em /sisi/ e o PHP-FPM no socket abaixo
#  (ajuste o caminho do socket à versão instalada).
# =====================================================================
client_max_body_size 80m;

location ^~ /sisi/uploads/ { deny all; return 404; }          # fotos: só pela api.php
location ~ ^/sisi/.*\.(sql|md|log|sh|py|bak|old|orig|ini|dist|swp|swo|save|zip|inc|phar|config)$ { deny all; return 404; }
location ~ ^/sisi/config { deny all; return 404; }                # config.php e qualquer cópia dele
location ~ ~$ { deny all; return 404; }                            # cópias de editor (arquivo~)
location ~ /\. { deny all; return 404; }

# Só a api.php é executada; qualquer outro .php (config.php etc.) é negado.
location = /sisi/api.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_read_timeout 120s;
}
location ~ \.php$ { deny all; return 404; }

location = /sisi/index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.jsonbin.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;
}
location /sisi/ { autoindex off; index index.html; }

# Em php.ini (ou no pool do FPM): post_max_size = 80M, upload_max_filesize = 80M,
# memory_limit = 256M, expose_php = Off.
